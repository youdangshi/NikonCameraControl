name: Build Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          ls "$SDK_ROOT/platforms"
          ls "$SDK_ROOT/build-tools"

      - name: Install dependencies and run protocol smoke test
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run test:protocol

      - name: Build web assets and sync Capacitor
        working-directory: app
        run: |
          npx vite build
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare release asset
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "Nini-${VERSION}-debug.apk"
          sha256sum "Nini-${VERSION}-debug.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          NOTES="docs/RELEASE_NOTES_${TAG}.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "妮妮 ${TAG}" \
              --target "$GITHUB_SHA" \
              --notes-file "$NOTES"
          fi
          gh release upload "$TAG" "Nini-${VERSION}-debug.apk" --clobber
